
name: Build CART3R CLIENT

on:
  workflow_dispatch:
  push:
    paths:
      - "CART3R-CLIENT-source.zip"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.2.1"

      - name: Extract project
        run: unzip -q CART3R-CLIENT-source.zip -d extracted

      - name: Fix Fabric Loom configuration
        working-directory: extracted/CART3R-CLIENT
        run: |
          sed -i "s/net.fabricmc.fabric-loom'/net.fabricmc.fabric-loom-remap'/" build.gradle
          sed -i 's/options.release = 25/options.release = 21/' build.gradle
          sed -i 's/JavaVersion.VERSION_25/JavaVersion.VERSION_21/g' build.gradle
          sed -i 's/>=25/>=21/' src/main/resources/fabric.mod.json

      - name: Build CART3R CLIENT
        working-directory: extracted/CART3R-CLIENT
        run: gradle build --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: CART3R-CLIENT-jar
          path: extracted/CART3R-CLIENT/build/libs/*.jar
          if-no-files-found: error
