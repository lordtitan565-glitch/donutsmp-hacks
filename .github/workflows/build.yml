
name: Build CART3R CLIENT

on:
  workflow_dispatch:
  push:
    paths:
      - "CART3R-CLIENT-source.zip"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.2.1"

      - name: Extract project
        run: unzip -q CART3R-CLIENT-source.zip -d extracted

      - name: Build CART3R
        working-directory: extracted/CART3R-CLIENT
        run: gradle build --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: CART3R-CLIENT-jar
          path: extracted/CART3R-CLIENT/build/libs/carter-client-*.jar
          if-no-files-found: error
